      case 'ad-migrate': {
        const s = D.settings;
        await Store.save('ads', { id: uid(), advertiser: s.ad_title || 'Khách hàng', title: '', image: s.ad_image, image_mobile: '', link_url: s.ad_link, placement: 'home', game_ids: [], start_at: today(), end_at: '', active: true, weight: 1, note: '' });
        await Store.saveSettings({ ...s, ad_image: '', ad_link: '' }); render(); toast('Đã chuyển thành chiến dịch, hãy bổ sung tên khách và ngày kết thúc.'); break;
      }
      case 'ag-open': AF.group = t.dataset.v; AF.q = ''; AF.kind = 'all'; AF.cat = 'all'; AF.sel = []; AF.renaming = false; editing = null; confirmDel = null; render(); $('#admin-main, main')?.scrollIntoView?.({ block: 'start' }); break;
      case 'ag-back': AF.group = null; AF.sel = []; AF.renaming = false; AF.q = ''; AF.kind = 'all'; AF.cat = 'all'; editing = null; confirmDel = null; LIB_PENDING = []; render(); break;
      case 'ag-rename': AF.renaming = true; render(); $('[data-ag-rename] input')?.select(); break;
      case 'ag-rename-no': AF.renaming = false; render(); break;
      case 'ag-del': confirmDel = 'ag:' + AF.group; render(); break;
      case 'ag-del-yes': {
        const items = ASSETS.filter(a => inGroup(a, AF.group)), ids = items.map(a => a.id);
        await Assets.removeMany(ids); items.forEach(a => a.url && deleteB2(a.url));
        ASSETS = ASSETS.filter(a => !ids.includes(a.id)); toast(`Đã xoá nhóm “${AF.group}” (${ids.length} tư liệu)`);
        AF.group = null; AF.sel = []; confirmDel = null; render(); break;
      }
      case 'ag-sel-all': AF.sel = filterAssets(ASSETS.filter(a => inGroup(a, AF.group))).map(a => a.id); render(); break;
      case 'ag-sel-none': AF.sel = []; render(); break;
      case 'lib-go': { const f = LIB_PENDING; if (!realGroup() && !AF.upGroup.trim()) { const inp = $('[data-af="upGroup"]'); inp?.focus(); inp?.classList.add('need'); toast('Hãy đặt tên nhóm trước.', true); break; } LIB_PENDING = []; await libUpload(f, t); break; }
      case 'lib-pend-clear': LIB_PENDING = []; render(); break;
      case 'asset-new': editing = { kind: 'assets', item: { ...BLANK.assets(), kind: t.dataset.kind, category: AF.cat !== 'all' ? AF.cat : ({ text: 'Bài viết & Caption', link: 'Link tham khảo', video: 'Video' }[t.dataset.kind] || 'Chưa phân loại') } }; confirmDel = null; render(); $('.panel')?.scrollIntoView({ block: 'start' }); break;
      case 'asset-edit': editing = { kind: 'assets', item: structuredClone(ASSETS.find(x => x.id === id)) }; confirmDel = null; render(); $('.panel')?.scrollIntoView({ block: 'start' }); break;
      case 'asset-del': confirmDel = 'as:' + id; render(); break;
      case 'asset-del-yes': { const a = ASSETS.find(x => x.id === id); await Assets.remove(id); if (a?.url) deleteB2(a.url); ASSETS = ASSETS.filter(x => x.id !== id); confirmDel = null; render(); toast('Đã xoá tư liệu'); break; }
      case 'pick': {
        const field = t.closest('.field');
        if (t.dataset.target === 'img') openPicker({ kind: 'image', onPick: ([u]) => { const w = field.querySelector('[data-img]'); setImg(w, u); w.querySelector('[data-img-url]').value = u; toast('Đã chọn ảnh từ kho'); } });
        else if (t.dataset.target === 'shots') openPicker({ kind: 'media', multi: true, onPick: urls => { const w = field.querySelector('[data-imgs]'); setShots(w, [...getShots(w), ...urls]); toast(`Đã thêm ${urls.length} ảnh từ kho`); } });
        else openPicker({ kind: 'video', onPick: ([u]) => { t.closest('form').elements[t.dataset.field].value = u; toast('Đã chọn video từ kho'); } });
        break;
      }
      case 'pk-close': PICK = null; drawPicker(); break;
      case 'pk-toggle': if (!PICK.multi) { finishPick([id]); break; } { const i = PICK.sel.indexOf(id); i >= 0 ? PICK.sel.splice(i, 1) : PICK.sel.push(id); drawPicker(); } break;
      case 'pk-done': finishPick(PICK.sel); break;
      case 'shot-move': { const w = t.closest('[data-imgs]'); const arr = getShots(w); const i = Number(t.dataset.i), j = i + Number(t.dataset.d); if (j < 0 || j >= arr.length) break; [arr[i], arr[j]] = [arr[j], arr[i]]; setShots(w, arr); break; }
      case 'shot-rm': { const w = t.closest('[data-imgs]'); const arr = getShots(w); arr.splice(Number(t.dataset.i), 1); setShots(w, arr); break; }
      case 'copy-backup': { const b = $('#backupBox'); try { await navigator.clipboard.writeText(b.value); toast('Đã sao chép JSON'); } catch { b.select(); toast('Đã bôi đen — nhấn Ctrl/Cmd + C.'); } break; }
      case 'import': { const v = JSON.parse($('#backupBox').value); if (!v.games || !v.genres) throw new Error('JSON không đúng định dạng (thiếu games/genres).'); D = { settings: { ...SEED.settings, ...v.settings }, genres: v.genres, games: v.games, banners: v.banners || [] }; Store.persist(); render(); toast('Đã nhập dữ liệu'); break; }
      case 'reset': confirmDel = '__reset'; render(); break;
      case 'reset-yes': D = structuredClone(SEED); Store.persist(); confirmDel = null; render(); toast('Đã nạp lại dữ liệu mẫu'); break;
      case 'logout': await sb.auth.signOut(); session = null; IS_ADMIN = null; ME = ''; MY_ROLE = ''; MSGS = null; ADMINS = null; ASSETS = null; AUTH_VIEW = ''; render(); break;
      case 'auth-view': AUTH_VIEW = t.dataset.v || ''; render(); break;
      case 'admin-del': confirmDel = 'adm:' + id; render(); break;
      case 'admin-del-yes': { const { error } = await sb.from('admins').delete().eq('email', id); if (error) throw new Error('Không xoá được: ' + error.message); confirmDel = null; ADMINS = null; render(); toast('Đã xoá quyền của ' + id); break; }
      case 'admin-invite': await inviteAdmin(id); toast('Đã gửi lại email mời tới ' + id); break;
    }
  } catch (err) { toast(err.message || 'Có lỗi xảy ra', true); }
});

document.addEventListener('input', e => {
  if (e.target.matches('[data-img-url]')) setImg(e.target.closest('[data-img]'), e.target.value.trim());
  if (e.target.matches('[data-cap]')) { const w = e.target.closest('[data-imgs]'), arr = getShots(w), i = Number(e.target.dataset.cap); if (arr[i]) { arr[i].caption = e.target.value; w.querySelector('input[type=hidden]').value = JSON.stringify(arr); } }
  if (e.target.matches('[data-count]')) { const c = e.target.parentElement.querySelector('.cnt-l span'); if (c) c.textContent = e.target.value.length; }
  if (e.target.matches('.acc-in')) { const ok = /^#[0-9a-f]{6}$/i.test(e.target.value); if (ok) e.target.closest('.acc-row').querySelector('.acc-prev').style.background = e.target.value; }
});
document.addEventListener('change', async e => {
  if (e.target.matches('select, input[type=checkbox]')) applyWhen(e.target.closest('form') || document);
  try {
    if (e.target.matches('[data-rte-img]') && e.target.files[0]) { await rteInsertImage(e.target, e.target.files[0]); return; }
    if (e.target.matches('[data-img-file],[data-shots-file],[data-url-file]') && e.target.files.length) {
      const files = [...e.target.files]; e.target.value = '';
      await processFiles(e.target, files); return;
    }
  } catch (err) { toast(err?.message === 'big-gif' ? 'File GIF lớn hơn 4 MB. Hãy dùng video .mp4 hoặc dán link GIF thay vì tải lên.' : (err?.message || 'Không đọc được ảnh này.'), true, 5000); }
});

document.addEventListener('submit', async e => {
  const rn = e.target.closest?.('[data-ag-rename]'), mv = e.target.closest?.('[data-ag-move]');
  if (rn || mv) {
    e.preventDefault();
    const name = String((rn ? rn.elements.name : mv.elements.to).value).trim().slice(0, 120);
    if (!name) { toast('Hãy nhập tên nhóm.', true); return; }
    try {
      if (rn) {
        if (name === AF.group) { AF.renaming = false; render(); return; }
        const merge = assetGroupNames().includes(name);
        const ids = ASSETS.filter(a => inGroup(a, AF.group)).map(a => a.id);
        await Assets.setGroup(ids, name); ASSETS.forEach(a => { if (ids.includes(a.id)) a.group_name = name; });
        toast(merge ? `Đã gộp vào nhóm “${name}”` : 'Đã đổi tên nhóm'); AF.group = name; AF.renaming = false;
      } else {
        const ids = AF.sel.filter(id => ASSETS.some(a => a.id === id));
        await Assets.setGroup(ids, name); ASSETS.forEach(a => { if (ids.includes(a.id)) a.group_name = name; });
        toast(`Đã chuyển ${ids.length} tư liệu sang nhóm “${name}”`); AF.sel = [];
      }
      render();
    } catch (err) { toast('Không lưu được: ' + (err.message || err), true); }
    return;
  }
  const form = e.target.closest('[data-form]');
  if (!form) return;
  e.preventDefault();
  const kind = form.dataset.form;
  const btn = form.querySelector('[type=submit]'); btn.disabled = true;
  try {
    if (kind === 'login') {
      const { data, error } = await sb.auth.signInWithPassword({ email: form.elements.email.value.trim(), password: form.elements.password.value });
      if (error) throw new Error(/confirm/i.test(error.message) ? 'Email chưa được xác nhận.' : 'Sai email hoặc mật khẩu.');
      session = data.session; MSGS = null; ADMINS = null; IS_ADMIN = null; render();
      await checkAdmin(); render(); return;
    }
    if (kind === 'forgot') {
      const em = form.elements.email.value.trim();
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em)) { toast('Email chưa đúng định dạng.', true); return; }
      const { error } = await sb.auth.resetPasswordForEmail(em, { redirectTo: location.origin + location.pathname });
      if (error && /rate/i.test(error.message)) throw new Error('Gửi quá nhiều lần, đợi vài phút rồi thử lại.');
      AUTH_VIEW = ''; render(); toast('Nếu email có quyền quản trị, link đặt lại mật khẩu đã được gửi.'); return;
    }
    if (kind === 'setpass') {
      const p1 = form.elements.password.value, p2 = form.elements.password2.value;
      if (p1.length < 8) { toast('Mật khẩu tối thiểu 8 ký tự.', true); return; }
      if (p1 !== p2) { toast('Hai lần nhập mật khẩu chưa khớp.', true); return; }
      const { error } = await sb.auth.updateUser({ password: p1 });
      if (error) throw new Error(/different/i.test(error.message) ? 'Mật khẩu mới phải khác mật khẩu cũ.' : 'Không lưu được mật khẩu: ' + error.message);
      AUTH_VIEW = ''; await checkAdmin(); render(); toast('Đã lưu mật khẩu mới'); return;
    }
    if (kind === 'admin-add') {
      const em = form.elements.email.value.trim().toLowerCase();
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em)) { toast('Email chưa đúng định dạng.', true); form.elements.email.focus(); return; }
      if (ADMINS?.some(a => a.email === em)) { toast('Email này đã là quản trị viên.', true); return; }
      const { error } = await sb.from('admins').insert({ email: em, role: 'admin', note: form.elements.note.value.trim(), added_by: String(ME).toLowerCase() });
      if (error) throw new Error('Không thêm được: ' + error.message);
      let msg = 'Đã thêm ' + em;
      if (form.elements.invite?.checked && workerOn()) { try { await inviteAdmin(em); msg += ' và gửi email mời'; } catch (e2) { msg += '. Chưa gửi được lời mời: ' + e2.message; } }
      ADMINS = null; render(); toast(msg); return;
    }
    const v = readForm(form, FIELDS[kind]);
    const missing = FIELDS[kind].find(f => f.req && !v[f.k]);
    if (kind === 'banners' && v.kind === 'ad' && !/^https?:\/\//i.test(v.link_url)) { toast('Banner quảng cáo cần link trang web của khách, bắt đầu bằng https://', true); form.elements.link_url?.focus(); return; }
    if (kind === 'banners' && v.media_type !== 'image' && !v.video_url) { toast('Hãy dán link video cho banner dạng video.', true); form.elements.video_url?.focus(); return; }
    if ((kind === 'banners' || kind === 'ads') && v.start_at && v.end_at && v.end_at < v.start_at) { toast('Ngày kết thúc phải sau ngày bắt đầu.', true); return; }
    if (kind === 'ads') {
      if (!/^https?:\/\//i.test(v.link_url)) { toast('Link trang web của khách phải bắt đầu bằng https://', true); form.elements.link_url?.focus(); return; }
      if (v.placement === 'none' && !v.hero_on) { toast('Hãy chọn ít nhất một vị trí: banner trang chủ hoặc banner ngang.', true); return; }
      if (v.hero_on && !v.hero_image && !v.hero_video) { toast('Hãy thêm ảnh hero (21:8) cho vị trí banner trang chủ.', true); return; }
      if (v.placement !== 'none' && !v.image) { toast('Hãy thêm ảnh banner ngang (6:1).', true); return; }
      if (v.placement === 'game' && !v.game_ids.length) { toast('Hãy chọn ít nhất một game.', true); return; }
      if (v.placement !== 'game') v.game_ids = [];
      v.weight = Math.min(10, Math.max(1, Number(v.weight) || 1));
      v.hero_sort = Number(v.hero_sort) || 0;
    }
    if (missing) { toast(`Hãy điền “${missing.label}”.`, true); form.elements[missing.k]?.focus(); return; }
    if (kind === 'display') v.banner_speed = Math.max(2, Number(v.banner_speed) || 6), v.grid_rows = Math.max(1, Number(v.grid_rows) || 3);
    if (kind === 'settings' || kind === 'display') { await Store.saveSettings({ ...D.settings, ...v }); render(); toast(kind === 'display' ? 'Đã lưu giao diện' : 'Đã lưu thông tin trang'); return; }
    if (kind === 'assets') {
      const it = { ...editing.item, ...v, id: editing.item.id || uid() };
      if (!it.created_at) { it.created_at = new Date().toISOString(); it.created_by = String(ME || ''); }
      if (!it.game_id) it.game_id = null;
      it.group_name = String(it.group_name || '').trim().slice(0, 120);
      if (it.kind !== 'text') it.content = it.content || '';
      if (it.kind !== 'text' && !it.url) { toast('Hãy dán link hoặc tải file lên.', true); return; }
      const saved = await Assets.save(it);
      const i = ASSETS.findIndex(x => x.id === saved.id); i >= 0 ? (ASSETS[i] = saved) : ASSETS.unshift(saved);
      editing = null; render(); toast('Đã lưu tư liệu'); return;
    }
    const item = { ...editing.item, ...v };
    if (kind === 'games') { item.clip_url = ''; item.youtube_url = ''; item.video_url = ''; item.highlights = ''; item.accent = okAccent(item.accent); item.summary = String(item.summary || '').slice(0, 160); item.screenshots = (item.screenshots || []).map(normMedia).filter(m => m.src); }
    if (!item.id) item.id = uid();
    if ('slug' in v) {
      let s = slugify(v.slug || item.title || item.name) || item.id.slice(0, 8), base = s, n = 2;
      while (D[kind].some(x => x.slug === s && x.id !== item.id)) s = `${base}-${n++}`;
      item.slug = s;
    }
    await Store.save(kind, item);
    editing = null; render(); toast(`Đã lưu ${LABELS[kind]}`);
  } catch (err) { toast(err.message || 'Lưu không thành công', true); }
  finally { btn.disabled = false; }
});


/* ============ KHỞI ĐỘNG ============ */
(async () => {
  try { await Store.load(); }
  catch (err) {
    if (MODE === 'cloud') { LOAD_ERROR = true; D = { settings: { ...SEED.settings }, genres: [], games: [], banners: [], ads: [] }; }   // KHÔNG hiện dữ liệu mẫu cho khách
    else D = structuredClone(SEED);
  }
  if (sb) sb.auth.onAuthStateChange((ev, s) => { session = s; if (typeof onAuthEvent === 'function') onAuthEvent(ev, s); });
  if (typeof afterBoot === 'function') await afterBoot();
  render();
  if (typeof startLive === 'function') startLive();
})();
</script>
